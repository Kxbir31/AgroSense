<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgroSense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@300;400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;color:#fff;background:#10261a;overflow:hidden}
.bg{position:fixed;inset:0;z-index:0;
  background:linear-gradient(rgba(0,0,0,.30),rgba(0,0,0,.60)),url(/static/background.jpg) center/cover no-repeat,linear-gradient(160deg,#4a7c52,#10261a)}
.glass{background:rgba(20,22,21,.62);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.12);box-shadow:0 10px 40px rgba(0,0,0,.35)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.brand{position:fixed;top:28px;left:44px;z-index:5;font-family:Outfit,sans-serif;font-weight:300;font-size:clamp(46px,7vw,92px);letter-spacing:-.03em;line-height:1;transition:.5s;text-shadow:0 2px 30px rgba(0,0,0,.35)}
body.chatting .brand{font-size:34px;top:22px}
.topright{position:fixed;top:22px;right:28px;z-index:6;display:flex;gap:10px;align-items:center}
.pill{height:44px;border-radius:22px;display:flex;align-items:center;gap:8px;padding:0 16px;font-size:14px;transition:.2s}
.pill:hover{background:rgba(40,44,42,.8)}
#locBtn span{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#wxBtn{width:44px;padding:0;justify-content:center;font-size:20px}

/* ---- permanent weather card ---- */
#wxCard{position:fixed;top:78px;right:28px;z-index:6;width:290px;border-radius:22px;padding:20px 22px;display:none;cursor:pointer;
  overflow:hidden;transition:width .45s cubic-bezier(.2,.8,.2,1),padding .45s cubic-bezier(.2,.8,.2,1),border-radius .45s,background .2s;animation:rise .5s}
#wxCard.show{display:block}
#wxCard:hover{background:rgba(30,34,32,.72)}
#wxCard::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 100% 0%,rgba(110,200,140,.16),transparent 60%)}
#wxCard .full,#wxCard .mini{position:relative}
#wxCard .mini{display:none;align-items:center;gap:10px;white-space:nowrap}
#wxCard .mini .ic{font-size:20px;line-height:1}
#wxCard .mini .mt{font-size:17px;font-weight:500}
#wxCard .mini .mc{font-size:12.5px;opacity:.7;text-transform:capitalize}
#wxCard.mini{width:auto;padding:9px 16px;border-radius:22px}
#wxCard.mini .full{display:none}
#wxCard.mini .mini{display:flex}
#wxCard .loc{font-size:12px;opacity:.65;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
#wxCard .live{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;color:#9be0b2}
#wxCard .live::before{content:"";width:6px;height:6px;border-radius:50%;background:#6ed08f;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(110,208,143,.6)}70%{box-shadow:0 0 0 7px rgba(110,208,143,0)}100%{box-shadow:0 0 0 0 rgba(110,208,143,0)}}
#wxCard .top{display:flex;align-items:center;justify-content:space-between}
#wxCard .t{font-size:44px;font-weight:300;line-height:1.15}
#wxCard .big{font-size:42px;line-height:1}
#wxCard .c{text-transform:capitalize;opacity:.85;margin-bottom:12px}
#wxCard .row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-top:1px solid rgba(255,255,255,.1);opacity:.9}
#wxCard .msg2{font-size:13px;opacity:.75}

main{position:fixed;inset:0;z-index:2;display:none}
body.ready main{display:block}
   #hero{position:absolute;z-index:3;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;padding:0 20px;transition:.3s}
body.chatting #hero{display:none}
#hero p{font-size:18px;font-weight:300;opacity:.9;margin-bottom:26px;text-shadow:0 1px 12px rgba(0,0,0,.5)}
.sugs{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:760px;margin:0 auto}
.sug{padding:10px 16px;border-radius:18px;font-size:13.5px;transition:.2s}
.sug:hover{background:rgba(50,56,52,.85);transform:translateY(-2px)}
#chat{position:absolute;inset:0;overflow-y:auto;padding:100px 20px 150px;scroll-behavior:smooth}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.msg{max-width:88%;padding:14px 18px;border-radius:20px;line-height:1.6;font-size:15px;animation:rise .3s;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:rgba(15,16,16,.78);border:1px solid rgba(255,255,255,.1);border-bottom-right-radius:6px;white-space:pre-wrap}
.msg.ai{align-self:flex-start;border-bottom-left-radius:6px}
.msg.err{color:#ffd0c8;border-color:rgba(255,120,100,.4)}
.msg.ai>*:first-child{margin-top:0}.msg.ai>*:last-child{margin-bottom:0}
.msg.ai p,.msg.ai ul,.msg.ai ol,.msg.ai table,.msg.ai pre{margin:10px 0}
.msg.ai ul,.msg.ai ol{padding-left:22px}
.msg.ai h1,.msg.ai h2,.msg.ai h3{font-size:16px;margin:14px 0 6px}
.msg.ai table{border-collapse:collapse;display:block;overflow-x:auto;font-size:13.5px}
.msg.ai th,.msg.ai td{border:1px solid rgba(255,255,255,.18);padding:6px 10px;text-align:left}
.msg.ai th{background:rgba(255,255,255,.08)}
.msg.ai code{background:rgba(255,255,255,.1);padding:1px 5px;border-radius:5px;font-size:13px}
.msg.ai pre{background:rgba(0,0,0,.45);padding:12px;border-radius:12px;overflow-x:auto}
.msg.ai pre code{background:none;padding:0}
.dots{display:flex;gap:5px;padding:4px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:#fff;opacity:.4;animation:b 1.1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.bar{position:fixed;bottom:34px;left:50%;transform:translateX(-50%);width:min(940px,calc(100% - 32px));min-height:62px;border-radius:32px;display:flex;align-items:flex-end;gap:6px;padding:9px 10px;background:rgba(24,24,24,.82)}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:20px;flex:none;transition:.2s;opacity:.85}
.ib:hover{background:rgba(255,255,255,.1);opacity:1}
#q{flex:1;background:none;border:0;outline:0;color:#fff;font:inherit;font-size:15.5px;resize:none;max-height:150px;padding:11px 6px;line-height:1.4}
#q::placeholder{color:rgba(255,255,255,.5)}
#think{display:flex;align-items:center;gap:6px;height:42px;padding:0 14px;border-radius:21px;font-size:14px;opacity:.7;flex:none}
#think.on{background:rgba(255,255,255,.16);opacity:1}
#mic.rec{background:rgba(220,60,50,.55)}
#send{background:#2f6fdb;color:#fff;opacity:1}
#send:disabled{background:rgba(255,255,255,.15);cursor:not-allowed}
#overlay{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:16px}
#overlay.show{display:grid}
.modal{position:relative;width:min(440px,100%);border-radius:28px;padding:40px 36px 34px;text-align:center;animation:rise .45s cubic-bezier(.2,.8,.2,1)}
.modal h3{font-family:Outfit,sans-serif;font-weight:300;font-size:30px;letter-spacing:-.02em;margin-bottom:22px}
.modal h2{font-size:21px;font-weight:500;margin-bottom:8px}
.modal .sub{font-size:14px;opacity:.7;line-height:1.5;margin-bottom:26px}
.modal label{display:block;text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.65;margin:0 0 7px 4px}
.combo{position:relative;margin-bottom:18px}
.combo input{width:100%;height:50px;border-radius:14px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);color:#fff;font:inherit;font-size:15px;padding:0 40px 0 16px;outline:0;transition:.2s}
.combo input:focus{border-color:rgba(255,255,255,.45);background:rgba(255,255,255,.1)}
.combo input:disabled{opacity:.4}
.combo input::placeholder{color:rgba(255,255,255,.45)}
.chev{position:absolute;right:16px;top:14px;opacity:.55;pointer-events:none}
.combo ul{position:absolute;left:0;right:0;top:56px;z-index:30;max-height:210px;overflow-y:auto;list-style:none;padding:6px;border-radius:14px;background:rgba(22,24,23,.97);border:1px solid rgba(255,255,255,.14);display:none;text-align:left}
.combo.open ul{display:block}
.combo li{padding:9px 12px;border-radius:9px;font-size:14.5px;cursor:pointer}
.combo li:hover{background:rgba(255,255,255,.12)}
.combo li.dim{opacity:.5;cursor:default}.combo li.dim:hover{background:none}
#go{width:100%;height:52px;border-radius:26px;background:#fff;color:#111;font-weight:500;font-size:15px;margin-top:6px;transition:.2s}
#go:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 24px rgba(255,255,255,.2)}
#go:disabled{background:rgba(255,255,255,.18);color:rgba(255,255,255,.45);cursor:not-allowed}
#x{position:absolute;top:14px;right:16px;width:34px;height:34px;border-radius:50%;font-size:18px;display:none}
#x:hover{background:rgba(255,255,255,.12)}
@media(max-width:640px){.brand{left:20px}#locBtn span{max-width:110px}.topright{right:14px}#wxCard{right:14px;width:250px}#think b{display:none}.modal{padding:34px 22px 26px}}
    /* ---- professional mic icon ---- */
#mic svg{width:22px;height:22px}

/* ---- listening popup ---- */
#listen{position:fixed;inset:0;z-index:25;display:none;place-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:16px}
#listen.show{display:grid}
.lbox{width:min(420px,100%);border-radius:28px;padding:34px 30px 28px;text-align:center;animation:rise .35s cubic-bezier(.2,.8,.2,1)}
.orb{position:relative;width:84px;height:84px;margin:0 auto 22px;border-radius:50%;background:linear-gradient(145deg,#3f8a55,#1f5a36);display:grid;place-items:center}
.orb svg{width:36px;height:36px;color:#fff;position:relative;z-index:2}
.orb::before,.orb::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(110,200,140,.55);animation:ring 2s ease-out infinite}
.orb::after{animation-delay:1s}
@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(2.1);opacity:0}}
.lbox h4{font-weight:500;font-size:18px;margin-bottom:4px}
.lbox .hint{font-size:13px;opacity:.65;margin-bottom:20px}
#wave{width:100%;height:64px;display:block;margin-bottom:10px}
#timer{font-variant-numeric:tabular-nums;font-size:14px;opacity:.8;margin-bottom:22px}
.lbtns{display:flex;gap:12px}
.lbtns button{flex:1;height:48px;border-radius:24px;font-size:14.5px;font-weight:500;transition:.2s}
#lcancel{background:rgba(255,255,255,.1)}
#lcancel:hover{background:rgba(255,255,255,.18)}
#ldone{background:#fff;color:#111}
#ldone:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(255,255,255,.2)}
</style>
</head>
<body>
<div class="bg"></div>
<div class="brand">AgroSense</div>

<div class="topright" id="topright" style="display:none">
  <button class="pill glass" id="wxBtn" title="Minimise / expand weather">⛅</button>
  <button class="pill glass" id="locBtn" title="Change location">📍 <span id="locTxt"></span></button>
</div>
<div class="glass" id="wxCard" title="Click to minimise / expand"></div>

<main>
  <div id="hero">
    <p>Your intelligent agriculture assistant</p>
    <div class="sugs">
      <button class="sug glass">What crops are suitable for my district?</button>
      <button class="sug glass">What's the weather today?</button>
      <button class="sug glass">Which crops have the highest profitability?</button>
      <button class="sug glass">What is the soil condition in my district?</button>
    </div>
  </div>
  <div id="chat"><div class="wrap" id="wrap"></div></div>
  <div class="bar glass">
    <button class="ib" id="plus" title="New chat">+</button>
    <textarea id="q" rows="1" placeholder="Ask AgroSense anything..."></textarea>
    <button id="think" title="Ask for a more detailed, reasoned answer">🧠 <b style="font-weight:400">Think</b></button>
    <button class="ib" id="mic" title="Speak">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/><path d="M8.5 21h7"/></svg>
</button>
    <button class="ib" id="send" title="Send" disabled>➤</button>
  </div>
</main>

<div id="overlay">
  <div class="modal glass">
    <button id="x" title="Close">✕</button>
    <h3>AgroSense</h3>
    <h2>📍 Let's personalize your experience</h2>
    <p class="sub">Select your location to get agriculture insights relevant to your area.</p>
    <label>State</label>
    <div class="combo" id="stateC"><input placeholder="Select your state" autocomplete="off"><span class="chev">▾</span><ul></ul></div>
    <label>District</label>
    <div class="combo" id="distC"><input placeholder="Select your district" autocomplete="off" disabled><span class="chev">▾</span><ul></ul></div>
    <button id="go" disabled>Continue to AgroSense</button>
  </div>
</div>
<div id="listen">
  <div class="lbox glass">
    <div class="orb">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/><path d="M8.5 21h7"/></svg>
    </div>
    <h4>Listening…</h4>
    <div class="hint">Speak your question in Hindi</div>
    <canvas id="wave"></canvas>
    <div id="timer">0:00 / 0:15</div>
    <div class="lbtns">
      <button id="lcancel">Cancel</button>
      <button id="ldone">Done</button>
    </div>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
let DATA = {}, LOC = null, busy = false, thinkOn = false, started = false;
const wxCache = {};

/* ---------- searchable combobox ---------- */
function Combo(root, getOpts, allowCustom, onChange) {
  const inp = root.querySelector('input'), ul = root.querySelector('ul');
  function render(all) {
    const q = inp.value.trim().toLowerCase(), opts = getOpts();
    const list = all ? opts : opts.filter(o => o.toLowerCase().includes(q));
    ul.innerHTML = '';
    list.forEach(o => {
      const li = document.createElement('li'); li.textContent = o;
      li.onmousedown = e => { e.preventDefault(); inp.value = o; close(); onChange(); };
      ul.appendChild(li);
    });
    if (allowCustom && q && !opts.some(o => o.toLowerCase() === q)) {
      const li = document.createElement('li'); li.textContent = 'Use "' + inp.value.trim() + '"';
      li.onmousedown = e => { e.preventDefault(); close(); onChange(); };
      ul.appendChild(li);
    }
    if (!ul.children.length) { const li = document.createElement('li'); li.className = 'dim'; li.textContent = 'No matches'; ul.appendChild(li); }
  }
  const close = () => root.classList.remove('open');
  inp.addEventListener('focus', () => { root.classList.add('open'); render(true); inp.select(); });
  inp.addEventListener('input', () => { root.classList.add('open'); render(false); onChange(); });
  inp.addEventListener('blur', () => setTimeout(() => { close(); onChange(); }, 120));
  return {
    inp,
    value() {
      const t = inp.value.trim(); if (!t) return null;
      const hit = getOpts().find(o => o.toLowerCase() === t.toLowerCase());
      return hit || (allowCustom ? t : null);
    },
    set(v) { inp.value = v || ''; }
  };
}

let prevState = null;
const stateCombo = Combo($('#stateC'), () => Object.keys(DATA), false, () => {
  const s = stateCombo.value();
  $('#distC input').disabled = !s;
  if (s !== prevState) { distCombo.set(''); prevState = s; }
  refreshGo();
});
const distCombo = Combo($('#distC'), () => DATA[stateCombo.value()] || [], true, refreshGo);
function refreshGo() { $('#go').disabled = !(stateCombo.value() && distCombo.value()); }

/* ---------- modal ---------- */
function openModal() {
  stateCombo.set(LOC ? LOC.state : ''); prevState = LOC ? LOC.state : null;
  $('#distC input').disabled = !LOC; distCombo.set(LOC ? LOC.district : '');
  $('#x').style.display = LOC ? 'block' : 'none';
  $('#overlay').classList.add('show'); refreshGo();
}
$('#x').onclick = () => $('#overlay').classList.remove('show');
$('#locBtn').onclick = () => openModal();
$('#go').onclick = () => {
  LOC = { state: stateCombo.value(), district: distCombo.value() };
  $('#locTxt').textContent = LOC.district + ', ' + LOC.state;
  $('#locBtn').title = LOC.district + ', ' + LOC.state;
  $('#overlay').classList.remove('show');
  document.body.classList.add('ready'); $('#topright').style.display = 'flex';
  $('#wxCard').classList.add('show');
  setWxMini(document.body.classList.contains('chatting') || window.innerWidth <= 640);
  loadWx();
  $('#q').focus();
};

/* ---------- weather (permanent card) ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const wxCard = $('#wxCard');
let wxLast = null, wxTimer = null;

function wxIcon(c) {
  c = String(c || '').toLowerCase();
  if (c.includes('thunder')) return '⛈️';
  if (c.includes('drizzle') || c.includes('rain') || c.includes('shower')) return '🌧️';
  if (c.includes('snow') || c.includes('sleet')) return '❄️';
  if (/mist|fog|haze|smoke|dust|sand/.test(c)) return '🌫️';
  if (c.includes('clear')) return '☀️';
  if (c.includes('few clouds') || c.includes('scattered')) return '⛅';
  if (c.includes('cloud') || c.includes('overcast')) return '☁️';
  return '⛅';
}
function setWxMini(m) { wxCard.classList.toggle('mini', !!m); }
const fmt = v => (typeof v === 'number' ? Math.round(v * 10) / 10 : v);

function drawWx(d) {
  wxLast = d;
  const ic = wxIcon(d.condition), place = esc(LOC.district + ', ' + LOC.state);
  wxCard.innerHTML = `
  <div class="mini"><span class="ic">${ic}</span><span class="mt">${fmt(d.temp)}°C</span><span class="mc">${esc(d.condition)}</span></div>
  <div class="full">
    <div class="loc"><span>📍 ${place}</span><span class="live">Live</span></div>
    <div class="top"><div class="t">${fmt(d.temp)}°C</div><div class="big">${ic}</div></div>
    <div class="c">${esc(d.condition)}</div>
    <div class="row"><span>Feels like</span><span>${fmt(d.feels_like)}°C</span></div>
    <div class="row"><span>Humidity</span><span>${d.humidity}%</span></div>
    <div class="row"><span>Wind</span><span>${d.wind} m/s</span></div>
    <div class="row"><span>Rain (last 1h)</span><span>${d.rain_1h} mm</span></div>
  </div>`;
  $('#wxBtn').textContent = ic;
}
function wxMsg(html) {
  wxCard.innerHTML = '<div class="mini"><span class="ic">⛅</span><span class="mc">' + html + '</span></div>' +
    '<div class="full"><div class="loc"><span>📍 ' + esc(LOC.district + ', ' + LOC.state) + '</span></div><div class="msg2">' + html + '</div></div>';
}
async function loadWx() {
  if (!LOC) return;
  const loc = LOC, key = loc.state + '|' + loc.district, c = wxCache[key];
  if (c && Date.now() - c.t < 600000) drawWx(c.d);
  else {
    wxCard.innerHTML = '<div class="mini"><div class="dots"><i></i><i></i><i></i></div></div><div class="full"><div class="dots"><i></i><i></i><i></i></div></div>';
    try {
      const r = await fetch('/api/weather?' + new URLSearchParams(loc));
      const d = await r.json();
      if (!r.ok) throw 0;
      wxCache[key] = { t: Date.now(), d };
      if (LOC === loc) drawWx(d);
    } catch { if (LOC === loc) wxMsg('Weather unavailable'); }
  }
  clearTimeout(wxTimer); wxTimer = setTimeout(loadWx, 600000); // auto-refresh every 10 min
}
wxCard.onclick = () => setWxMini(!wxCard.classList.contains('mini'));
$('#wxBtn').onclick = () => setWxMini(!wxCard.classList.contains('mini'));

/* ---------- chat ---------- */
const wrap = $('#wrap'), q = $('#q');
function scrollDown() { $('#chat').scrollTop = $('#chat').scrollHeight; }
function addMsg(cls, content, html) {
  const d = document.createElement('div'); d.className = 'msg ' + cls + (cls.includes('ai') ? ' glass' : '');
  html ? d.innerHTML = content : d.textContent = content;
  wrap.appendChild(d); scrollDown(); return d;
}
function setBusy(b) { busy = b; $('#send').disabled = b || !q.value.trim(); }

async function ask(text) {
  text = text.trim();
  if (!text || busy || !LOC) return;
  document.body.classList.add('chatting'); setWxMini(true);
  addMsg('user', text); q.value = ''; q.style.height = 'auto'; setBusy(true);
  const wait = addMsg('ai', '<div class="dots"><i></i><i></i><i></i></div>', true);
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 180000);
  try {
    const r = await fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, signal: ctl.signal,
      body: JSON.stringify({ query: text, state: LOC.state, district: LOC.district, think: thinkOn })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Request failed');
    wait.innerHTML = DOMPurify.sanitize(marked.parse(d.answer));
  } catch (e) {
    wait.classList.add('err');
    wait.textContent = e.name === 'AbortError' ? 'This is taking too long. Please try again.'
      : (e instanceof TypeError ? 'Cannot reach the server. Check your connection and try again.' : e.message);
  } finally { clearTimeout(timer); setBusy(false); scrollDown(); }
}
q.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(q.value); } });
q.addEventListener('input', () => { q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight, 150) + 'px'; $('#send').disabled = busy || !q.value.trim(); });
$('#send').onclick = () => ask(q.value);
document.querySelectorAll('.sug').forEach(b => b.onclick = () => ask(b.textContent));
$('#think').onclick = () => { thinkOn = !thinkOn; $('#think').classList.toggle('on', thinkOn); };
$('#plus').onclick = () => { if (busy) return; wrap.innerHTML = ''; document.body.classList.remove('chatting'); setWxMini(window.innerWidth <= 640); q.focus(); };

/* ---------- voice ---------- */
/* ---------- voice (Gnani STT, Hindi) ---------- */
let recorder = null, recChunks = [], recStream = null, recTimer = null;

async function toWav(blob) {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const decoded = await ctx.decodeAudioData(await blob.arrayBuffer()); ctx.close();
  const off = new OfflineAudioContext(1, Math.ceil(decoded.duration * 16000), 16000);
  const src = off.createBufferSource(); src.buffer = decoded; src.connect(off.destination); src.start();
  const pcm = (await off.startRendering()).getChannelData(0);
  const v = new DataView(new ArrayBuffer(44 + pcm.length * 2));
  const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); v.setUint32(4, 36 + pcm.length * 2, true); w(8, 'WAVEfmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, 16000, true); v.setUint32(28, 32000, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, 'data'); v.setUint32(40, pcm.length * 2, true);
  for (let i = 0; i < pcm.length; i++) {
    const s = Math.max(-1, Math.min(1, pcm[i]));
    v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
  }
  return new Blob([v], { type: 'audio/wav' });
}

async function askVoice(wav) {
  if (busy || !LOC) return;
  document.body.classList.add('chatting'); setWxMini(true);
  const u = addMsg('user', '🎤 Processing your voice…');
  setBusy(true);
  const wait = addMsg('ai', '<div class="dots"><i></i><i></i><i></i></div>', true);
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 180000);
  try {
    const fd = new FormData();
    fd.append('audio', wav, 'voice.wav');
    fd.append('state', LOC.state); fd.append('district', LOC.district); fd.append('think', thinkOn);
    const r = await fetch('/api/voice', { method: 'POST', body: fd, signal: ctl.signal });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Request failed');
    u.textContent = '🎤 ' + d.transcript + '\n(' + d.translated + ')';
    wait.innerHTML = DOMPurify.sanitize(marked.parse(d.answer));
  } catch (e) {
    u.textContent = '🎤 (voice message)';
    wait.classList.add('err');
    wait.textContent = e.name === 'AbortError' ? 'This is taking too long. Please try again.'
      : (e instanceof TypeError ? 'Cannot reach the server. Check your connection and try again.' : e.message);
  } finally { clearTimeout(timer); setBusy(false); scrollDown(); }
}

let recCancelled = false, audioCtx = null, analyser = null, rafId = null, tickId = null, recStart = 0;

function fillBar(c, x, y, w, h) {
  c.beginPath();
  c.roundRect ? c.roundRect(x, y, w, h, w / 2) : c.rect(x, y, w, h);
  c.fill();
}

function drawWave() {
  const cv = $('#wave'), c = cv.getContext('2d'), dpr = window.devicePixelRatio || 1;
  cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr;
  const data = new Uint8Array(analyser.frequencyBinCount);
  const bars = 40, gap = 3 * dpr, bw = (cv.width - gap * (bars - 1)) / bars;
  (function loop() {
    rafId = requestAnimationFrame(loop);
    analyser.getByteFrequencyData(data);
    c.clearRect(0, 0, cv.width, cv.height);
    for (let i = 0; i < bars; i++) {
      const v = data[Math.floor(i * data.length * 0.6 / bars)] / 255;
      const h = Math.max(4 * dpr, v * cv.height);
      c.fillStyle = 'rgba(120,210,150,' + (0.45 + v * 0.55) + ')';
      fillBar(c, i * (bw + gap), (cv.height - h) / 2, bw, h);
    }
  })();
}

function closeListening() {
  cancelAnimationFrame(rafId); clearInterval(tickId); clearTimeout(recTimer);
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  $('#listen').classList.remove('show');
  $('#mic').classList.remove('rec');
}

async function startRec() {
  try { recStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch { alert('Microphone permission is needed for voice input.'); return; }
  recChunks = []; recCancelled = false;

  // live waveform from the real microphone signal
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  audioCtx.resume();
  analyser = audioCtx.createAnalyser(); analyser.fftSize = 256; analyser.smoothingTimeConstant = 0.75;
  audioCtx.createMediaStreamSource(recStream).connect(analyser);

  recorder = new MediaRecorder(recStream);
  recorder.ondataavailable = e => recChunks.push(e.data);
  recorder.onstop = async () => {
    closeListening();
    recStream.getTracks().forEach(t => t.stop());
    if (recCancelled) return;
    try { askVoice(await toWav(new Blob(recChunks))); }
    catch { alert('Could not read the recorded audio. Please try again.'); }
  };
  recorder.start();

  $('#mic').classList.add('rec');
  $('#listen').classList.add('show');
  drawWave();
  recStart = Date.now();
  $('#timer').textContent = '0:00 / 0:15';
  tickId = setInterval(() => {
    const s = Math.floor((Date.now() - recStart) / 1000);
    $('#timer').textContent = '0:' + String(s).padStart(2, '0') + ' / 0:15';
  }, 250);
  recTimer = setTimeout(() => recorder.state === 'recording' && recorder.stop(), 15000);
}

function stopRec(cancel) {
  if (recorder && recorder.state === 'recording') { recCancelled = !!cancel; recorder.stop(); }
}
$('#ldone').onclick = () => stopRec(false);
$('#lcancel').onclick = () => stopRec(true);
document.addEventListener('keydown', e => { if (e.key === 'Escape') stopRec(true); });

if (!navigator.mediaDevices || !window.MediaRecorder) { $('#mic').style.display = 'none'; }
else {
  $('#mic').title = 'Speak in Hindi';
  $('#mic').onclick = () => { if (!busy) startRec(); };
}
/* ---------- start ---------- */
fetch('/api/locations').then(r => r.json()).then(d => { DATA = d; openModal(); })
  .catch(() => alert('Could not load locations. Is the server running?'));
</script>
