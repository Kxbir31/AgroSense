<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgroSense</title>

<!-- fonts: Fraunces for the big headings, Bricolage Grotesque for everything else -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..700&family=Fraunces:opsz,wght@9..144,300..500&display=swap" rel="stylesheet">

<!-- libraries: marked turns markdown into html, DOMPurify keeps that html safe -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>

<style>
/* ================= #colours & #fonts (change the look from here) ================= */
:root{
  --night:   #0b1a13;               /* darkest green, page base */
  --field:   #1d4a31;               /* mid green, used in gradients and the mic orb */
  --mist:    #e9f0e3;               /* main text colour (soft off-white, easier on eyes) */
  --mist-dim:rgba(233,240,227,.68); /* secondary text */
  --grain:   #e8b84a;               /* wheat/mustard accent: send button, user bubble, highlights */
  --grain-ink:#2b1f05;              /* dark text that sits on top of the accent */
  --sprout:  #8fd3a4;               /* light green for the "live" dot and the waveform */
  --danger:  #ffb4a4;               /* error text */

  --glass-bg:   rgba(14,28,21,.58); /* panel background */
  --glass-line: rgba(233,240,227,.14);

  --font-display:'Fraunces',Georgia,serif;
  --font-ui:'Bricolage Grotesque',system-ui,sans-serif;

  --ease:cubic-bezier(.2,.8,.2,1);
}

/* ================= #reset & #page basics ================= */
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  font-family:var(--font-ui);
  color:var(--mist);
  background:var(--night);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--grain);outline-offset:2px}

/* ================= #background ================= */
.bg{
  position:fixed;inset:0;z-index:0;
  /* dark green wash on top of your photo; falls back to plain gradient if the image is missing */
  background:
    linear-gradient(180deg,rgba(11,26,19,.35) 0%,rgba(11,26,19,.78) 100%),
    url(/static/background.jpg) center/cover no-repeat,
    linear-gradient(160deg,#3e7a50,#0b1a13);
}

/* ================= #glass panel (used on almost everything) ================= */
.glass{
  background:var(--glass-bg);
  backdrop-filter:blur(20px) saturate(1.2);
  -webkit-backdrop-filter:blur(20px) saturate(1.2);
  border:1px solid var(--glass-line);
  box-shadow:0 18px 50px rgba(0,0,0,.35);
}

/* ================= #brand (top-left logo text) ================= */
.brand{
  position:fixed;top:26px;left:44px;z-index:5;
  font-family:var(--font-display);
  font-weight:300;
  font-size:clamp(48px,7.5vw,100px);
  letter-spacing:-.045em;
  line-height:1;
  font-variation-settings:"opsz" 144;
  text-shadow:0 4px 40px rgba(0,0,0,.4);
  transition:font-size .5s var(--ease),top .5s var(--ease);
}
body.chatting .brand{font-size:32px;top:22px}

/* ================= #top-right controls (location + weather toggle) ================= */
.topright{position:fixed;top:22px;right:28px;z-index:6;display:flex;align-items:center;width:306px}  /* same width as the weather card */
.pill{
  height:44px;border-radius:22px;
  display:flex;align-items:center;gap:8px;
  padding:0 18px;font-size:14px;
  transition:background .2s,transform .2s;
}
.pill:hover{background:rgba(29,74,49,.7)}
#locBtn{width:100%}
#locBtn span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ================= #weather card ================= */
#wxCard{
  --tone:232,184,74;                 /* glow colour (r,g,b), changes with the weather */
  position:fixed;top:78px;right:28px;z-index:6;
  width:306px;border-radius:30px;padding:22px 22px 20px;
  display:none;cursor:pointer;overflow:hidden;
  transition:width .45s var(--ease),padding .45s var(--ease),border-radius .45s,background .2s;
  animation:rise .5s var(--ease);
}
#wxCard.show{display:block}
#wxCard:hover{background:rgba(20,40,30,.72)}

/* mood colours: the card glows differently for each kind of weather */
#wxCard[data-tone="clear"]{--tone:240,190,70}
#wxCard[data-tone="cloud"]{--tone:150,185,170}
#wxCard[data-tone="rain"] {--tone:90,170,200}
#wxCard[data-tone="storm"]{--tone:150,120,210}
#wxCard[data-tone="mist"] {--tone:200,210,200}
#wxCard[data-tone="snow"] {--tone:190,225,245}

/* big soft glow behind the temperature */
#wxCard::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(70% 60% at 85% 8%,rgba(var(--tone),.34),transparent 70%),
    radial-gradient(90% 50% at 0% 100%,rgba(var(--tone),.10),transparent 70%);
  transition:background .6s;
}
#wxCard .full,#wxCard .mini{position:relative}

/* ---- minimised version (small pill) ---- */
#wxCard .mini{display:none;align-items:center;gap:10px;white-space:nowrap}
#wxCard .mini .ic{font-size:20px;line-height:1}
#wxCard .mini .mt{font-size:17px;font-weight:500}
#wxCard .mini .mc{font-size:12.5px;color:var(--mist-dim);text-transform:capitalize}
#wxCard.mini{width:auto;padding:9px 16px;border-radius:22px}
#wxCard.mini .full{display:none}
#wxCard.mini .mini{display:flex}

/* ---- full version ---- */
/* place + live dot */
#wxCard .loc{font-size:12.5px;color:var(--mist-dim);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
#wxCard .live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sprout)}
#wxCard .live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--sprout);animation:pulse 2s infinite}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(143,211,164,.6)}
  70%{box-shadow:0 0 0 7px rgba(143,211,164,0)}
  100%{box-shadow:0 0 0 0 rgba(143,211,164,0)}
}

/* temperature on the left, floating icon on the right */
#wxCard .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
#wxCard .t{font-family:var(--font-display);font-size:78px;font-weight:300;line-height:1;letter-spacing:-.06em;font-variation-settings:"opsz" 144}
#wxCard .t sup{font-size:26px;letter-spacing:0;vertical-align:top;position:relative;top:10px;margin-left:3px;opacity:.7}
#wxCard .orbicon{position:relative;width:84px;height:84px;display:grid;place-items:center;font-size:48px}
#wxCard .orbicon::before{
  content:"";position:absolute;inset:4px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(var(--tone),.55),rgba(var(--tone),.08) 70%);
  border:1px solid rgba(var(--tone),.35);
}
#wxCard .orbicon span{position:relative;animation:floaty 5s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* condition + feels like */
#wxCard .c{font-family:var(--font-display);font-size:22px;font-weight:400;letter-spacing:-.02em;text-transform:capitalize}
#wxCard .fl{font-size:13px;color:var(--mist-dim);margin:2px 0 16px}

/* three small stat tiles */
#wxCard .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#wxCard .tile{background:rgba(255,255,255,.06);border:1px solid var(--glass-line);border-radius:16px;padding:10px 10px 11px}
#wxCard .tile small{display:block;font-size:11.5px;color:var(--mist-dim);margin-bottom:3px}
#wxCard .tile b{font-size:15px;font-weight:550}
#wxCard .tile em{font-style:normal;font-size:11px;color:var(--mist-dim);margin-left:2px}
/* humidity bar fills up to the real percentage */
#wxCard .meter{height:4px;border-radius:2px;background:rgba(255,255,255,.12);margin-top:8px;overflow:hidden}
#wxCard .meter i{display:block;height:100%;border-radius:2px;background:rgb(var(--tone));transition:width .8s var(--ease)}

/* farming tip at the bottom */
#wxCard .tip{margin-top:14px;padding-top:13px;border-top:1px solid var(--glass-line);font-size:13px;line-height:1.5;color:var(--mist)}

#wxCard .msg2{font-size:13px;color:var(--mist-dim)}

/* ================= #main area ================= */
main{position:fixed;inset:0;z-index:2;display:none}
body.ready main{display:block}

/* ---- hero (what you see before the first question) ---- */
#hero{
  position:absolute;z-index:3;left:0;right:0;top:50%;
  transform:translateY(-50%);
  text-align:center;padding:0 20px;
}
body.chatting #hero{display:none}
#hero p{
  font-family:var(--font-display);
  font-weight:300;
  font-size:clamp(26px,3.6vw,42px);
  letter-spacing:-.02em;
  line-height:1.2;
  margin-bottom:30px;
  text-shadow:0 2px 24px rgba(0,0,0,.5);
}
.sugs{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:760px;margin:0 auto}
.sug{padding:11px 18px;border-radius:18px;font-size:14px;transition:background .2s,transform .2s var(--ease),border-color .2s}
.sug:hover{background:rgba(29,74,49,.75);transform:translateY(-2px);border-color:rgba(232,184,74,.5)}

/* ================= #chat messages ================= */
#chat{position:absolute;inset:0;overflow-y:auto;padding:100px 20px 150px;scroll-behavior:smooth}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.msg{
  max-width:88%;padding:14px 18px;border-radius:22px;
  line-height:1.65;font-size:15px;
  animation:rise .3s var(--ease);
  overflow-wrap:anywhere;
}
/* your message: solid wheat bubble so it stands out from the glass replies */
.msg.user{
  align-self:flex-end;
  background:var(--grain);color:var(--grain-ink);
  border-bottom-right-radius:6px;
  white-space:pre-wrap;font-weight:450;
  box-shadow:0 8px 24px rgba(0,0,0,.25);
}
.msg.ai{align-self:flex-start;border-bottom-left-radius:6px}
.msg.err{color:var(--danger);border-color:rgba(255,160,140,.4)}

/* markdown inside AI replies */
.msg.ai>*:first-child{margin-top:0}
.msg.ai>*:last-child{margin-bottom:0}
.msg.ai p,.msg.ai ul,.msg.ai ol,.msg.ai table,.msg.ai pre{margin:10px 0}
.msg.ai ul,.msg.ai ol{padding-left:22px}
.msg.ai li{margin:3px 0}
.msg.ai h1,.msg.ai h2,.msg.ai h3{font-family:var(--font-display);font-weight:400;font-size:19px;letter-spacing:-.01em;margin:16px 0 6px}
.msg.ai table{border-collapse:collapse;display:block;overflow-x:auto;font-size:13.5px}
.msg.ai th,.msg.ai td{border:1px solid var(--glass-line);padding:7px 11px;text-align:left}
.msg.ai th{background:rgba(232,184,74,.12)}
.msg.ai code{background:rgba(255,255,255,.1);padding:1px 6px;border-radius:5px;font-size:13px}
.msg.ai pre{background:rgba(0,0,0,.45);padding:12px;border-radius:12px;overflow-x:auto}
.msg.ai pre code{background:none;padding:0}

/* "typing" dots */
.dots{display:flex;gap:5px;padding:4px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--grain);opacity:.4;animation:bounce 1.1s infinite}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ================= #input bar (bottom) ================= */
.bar{
  position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
  width:min(940px,calc(100% - 32px));min-height:64px;
  border-radius:34px;
  display:flex;align-items:flex-end;gap:6px;padding:9px 10px;
  background:rgba(11,24,18,.8);
}
.bar:focus-within{border-color:rgba(232,184,74,.45)}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:21px;flex:none;transition:background .2s,opacity .2s;opacity:.85}
.ib:hover{background:rgba(255,255,255,.1);opacity:1}
#q{
  flex:1;background:none;border:0;outline:0;
  color:var(--mist);font:inherit;font-size:15.5px;
  resize:none;max-height:150px;padding:12px 6px;line-height:1.4;
}
#q::placeholder{color:rgba(233,240,227,.45)}

/* "Think" toggle */
#think{display:flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:22px;font-size:14px;opacity:.7;flex:none;transition:background .2s,opacity .2s}
#think:hover{opacity:1}
#think.on{background:rgba(232,184,74,.2);color:var(--grain);opacity:1}

/* mic + send */
#mic svg{width:22px;height:22px}
#mic.rec{background:rgba(220,70,55,.55)}
#send{background:var(--grain);color:var(--grain-ink);opacity:1;font-size:18px}
#send:hover{background:#f2c966}
#send:disabled{background:rgba(255,255,255,.12);color:rgba(255,255,255,.4);cursor:not-allowed}

/* ================= #location popup ================= */
#overlay{
  position:fixed;inset:0;z-index:20;display:none;place-items:center;
  background:rgba(5,12,8,.45);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:16px;
}
#overlay.show{display:grid}
.modal{
  position:relative;width:min(450px,100%);
  border-radius:30px;padding:42px 36px 34px;text-align:center;
  animation:rise .45s var(--ease);
}
.modal h3{font-family:var(--font-display);font-weight:300;font-size:38px;letter-spacing:-.04em;margin-bottom:20px}
.modal h2{font-size:19px;font-weight:550;margin-bottom:8px}
.modal .sub{font-size:14px;color:var(--mist-dim);line-height:1.55;margin-bottom:26px}
.modal label{display:block;text-align:left;font-size:13px;font-weight:500;color:var(--mist-dim);margin:0 0 7px 4px}

/* dropdown-style search boxes */
.combo{position:relative;margin-bottom:18px}
.combo input{
  width:100%;height:52px;border-radius:16px;
  border:1px solid var(--glass-line);background:rgba(255,255,255,.06);
  color:var(--mist);font:inherit;font-size:15px;
  padding:0 40px 0 16px;outline:0;transition:border-color .2s,background .2s;
}
.combo input:focus{border-color:rgba(232,184,74,.6);background:rgba(255,255,255,.09)}
.combo input:disabled{opacity:.4}
.combo input::placeholder{color:rgba(233,240,227,.42)}
.chev{position:absolute;right:16px;top:15px;opacity:.55;pointer-events:none}
.combo ul{
  position:absolute;left:0;right:0;top:58px;z-index:30;
  max-height:210px;overflow-y:auto;list-style:none;padding:6px;
  border-radius:16px;background:rgba(10,22,16,.97);
  border:1px solid var(--glass-line);display:none;text-align:left;
}
.combo.open ul{display:block}
.combo li{padding:9px 12px;border-radius:10px;font-size:14.5px;cursor:pointer}
.combo li:hover{background:rgba(232,184,74,.16)}
.combo li.dim{opacity:.5;cursor:default}
.combo li.dim:hover{background:none}

/* continue button */
#go{
  width:100%;height:54px;border-radius:27px;
  background:var(--grain);color:var(--grain-ink);
  font-weight:600;font-size:15px;margin-top:6px;
  transition:transform .2s,box-shadow .2s,background .2s;
}
#go:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 10px 28px rgba(232,184,74,.3)}
#go:disabled{background:rgba(255,255,255,.14);color:rgba(255,255,255,.4);cursor:not-allowed}
#x{position:absolute;top:14px;right:16px;width:34px;height:34px;border-radius:50%;font-size:18px;display:none}
#x:hover{background:rgba(255,255,255,.12)}

/* ================= #listening popup (voice) ================= */
#listen{
  position:fixed;inset:0;z-index:25;display:none;place-items:center;
  background:rgba(5,12,8,.5);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding:16px;
}
#listen.show{display:grid}
.lbox{width:min(420px,100%);border-radius:30px;padding:34px 30px 28px;text-align:center;animation:rise .35s var(--ease)}
.orb{
  position:relative;width:84px;height:84px;margin:0 auto 22px;border-radius:50%;
  background:linear-gradient(145deg,#3f8a55,var(--field));
  display:grid;place-items:center;
}
.orb svg{width:36px;height:36px;color:#fff;position:relative;z-index:2}
/* two rings that ripple outwards */
.orb::before,.orb::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(143,211,164,.55);animation:ring 2s ease-out infinite}
.orb::after{animation-delay:1s}
@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(2.1);opacity:0}}
.lbox h4{font-family:var(--font-display);font-weight:400;font-size:24px;letter-spacing:-.02em;margin-bottom:4px}
.lbox .hint{font-size:13.5px;color:var(--mist-dim);margin-bottom:20px}
#wave{width:100%;height:64px;display:block;margin-bottom:10px}
#timer{font-variant-numeric:tabular-nums;font-size:14px;color:var(--mist-dim);margin-bottom:22px}
.lbtns{display:flex;gap:12px}
.lbtns button{flex:1;height:48px;border-radius:24px;font-size:14.5px;font-weight:550;transition:transform .2s,background .2s}
#lcancel{background:rgba(255,255,255,.1)}
#lcancel:hover{background:rgba(255,255,255,.18)}
#ldone{background:var(--grain);color:var(--grain-ink)}
#ldone:hover{transform:translateY(-1px)}

/* ================= #mobile ================= */
@media(max-width:640px){
  .brand{left:20px}
  .topright{right:14px;width:250px}
  #wxCard{right:14px;width:250px}
  #think b{display:none}
  .modal{padding:34px 22px 26px}
}

/* people who turned off animations in their device settings */
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>

<body>
<!-- background photo -->
<div class="bg"></div>

<!-- logo text -->
<div class="brand">AgroSense</div>

<!-- top right: weather toggle + location button (hidden until a location is chosen) -->
<div class="topright" id="topright" style="display:none">
  <button class="pill glass" id="locBtn" title="Change location">📍 <span id="locTxt"></span></button>
</div>

<!-- weather card (filled by JS) -->
<div class="glass" id="wxCard" title="Click to minimise / expand"></div>

<main>
  <!-- first screen: tagline + question ideas -->
  <div id="hero">
    <p>Your intelligent agriculture assistant</p>
    <div class="sugs">
      <button class="sug glass">What crops are suitable for my district?</button>
      <button class="sug glass">What's the weather today?</button>
      <button class="sug glass">Which crops have the highest profitability?</button>
      <button class="sug glass">What is the soil condition in my district?</button>
    </div>
  </div>

  <!-- conversation -->
  <div id="chat"><div class="wrap" id="wrap"></div></div>

  <!-- input bar -->
  <div class="bar glass">
    <button class="ib" id="plus" title="New chat">+</button>
    <textarea id="q" rows="1" placeholder="Ask AgroSense anything..."></textarea>
    <button id="think" title="Ask for a more detailed, reasoned answer">🧠 <b style="font-weight:400">Think</b></button>
    <button class="ib" id="mic" title="Speak">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/><path d="M8.5 21h7"/></svg>
    </button>
    <button class="ib" id="send" title="Send" disabled>➤</button>
  </div>
</main>

<!-- location popup -->
<div id="overlay">
  <div class="modal glass">
    <button id="x" title="Close">✕</button>
    <h3>AgroSense</h3>
    <h2>📍 Let's personalize your experience</h2>
    <p class="sub">Select your location to get agriculture insights relevant to your area.</p>
    <label>State</label>
    <div class="combo" id="stateC"><input placeholder="Select your state" autocomplete="off"><span class="chev">▾</span><ul></ul></div>
    <label>District</label>
    <div class="combo" id="distC"><input placeholder="Select your district" autocomplete="off" disabled><span class="chev">▾</span><ul></ul></div>
    <button id="go" disabled>Continue to AgroSense</button>
  </div>
</div>

<!-- voice popup -->
<div id="listen">
  <div class="lbox glass">
    <div class="orb">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/><path d="M8.5 21h7"/></svg>
    </div>
    <h4>Listening…</h4>
    <div class="hint">Speak your question in Hindi</div>
    <canvas id="wave"></canvas>
    <div id="timer">0:00 / 0:15</div>
    <div class="lbtns">
      <button id="lcancel">Cancel</button>
      <button id="ldone">Done</button>
    </div>
  </div>
</div>

<script>
/* ================= #helpers & #app state ================= */
const $ = s => document.querySelector(s);   // short way to grab an element

let DATA = {};          // { state: [districts] } loaded from /api/locations
let LOC = null;         // chosen location { state, district }
let busy = false;       // true while waiting for a reply
let thinkOn = false;    // "Think" button state
const wxCache = {};     // weather results saved for 10 minutes


/* ================= #searchable dropdown (state / district) ================= */
function Combo(root, getOpts, allowCustom, onChange) {
  const inp = root.querySelector('input');
  const ul  = root.querySelector('ul');
  const close = () => root.classList.remove('open');

  // build the list of options (filtered by what the user typed)
  function render(showAll) {
    const text = inp.value.trim().toLowerCase();
    const opts = getOpts();
    const list = showAll ? opts : opts.filter(o => o.toLowerCase().includes(text));
    ul.innerHTML = '';

    list.forEach(o => {
      const li = document.createElement('li');
      li.textContent = o;
      // mousedown (not click) so it fires before the input loses focus
      li.onmousedown = e => { e.preventDefault(); inp.value = o; close(); onChange(); };
      ul.appendChild(li);
    });

    // district box lets people type a name that isn't in the list
    if (allowCustom && text && !opts.some(o => o.toLowerCase() === text)) {
      const li = document.createElement('li');
      li.textContent = 'Use "' + inp.value.trim() + '"';
      li.onmousedown = e => { e.preventDefault(); close(); onChange(); };
      ul.appendChild(li);
    }

    if (!ul.children.length) {
      const li = document.createElement('li');
      li.className = 'dim'; li.textContent = 'No matches';
      ul.appendChild(li);
    }
  }

  inp.addEventListener('focus', () => { root.classList.add('open'); render(true); inp.select(); });
  inp.addEventListener('input', () => { root.classList.add('open'); render(false); onChange(); });
  inp.addEventListener('blur',  () => setTimeout(() => { close(); onChange(); }, 120));

  return {
    inp,
    // returns the matched option, a custom value (if allowed) or null
    value() {
      const t = inp.value.trim();
      if (!t) return null;
      const hit = getOpts().find(o => o.toLowerCase() === t.toLowerCase());
      return hit || (allowCustom ? t : null);
    },
    set(v) { inp.value = v || ''; }
  };
}

let prevState = null;

const stateCombo = Combo($('#stateC'), () => Object.keys(DATA), false, () => {
  const s = stateCombo.value();
  $('#distC input').disabled = !s;                       // district unlocks after state
  if (s !== prevState) { distCombo.set(''); prevState = s; }  // new state = clear district
  refreshGo();
});

const distCombo = Combo($('#distC'), () => DATA[stateCombo.value()] || [], true, refreshGo);

// enable "Continue" only when both boxes are filled
function refreshGo() { $('#go').disabled = !(stateCombo.value() && distCombo.value()); }


/* ================= #location popup ================= */
function openModal() {
  stateCombo.set(LOC ? LOC.state : '');
  prevState = LOC ? LOC.state : null;
  $('#distC input').disabled = !LOC;
  distCombo.set(LOC ? LOC.district : '');
  $('#x').style.display = LOC ? 'block' : 'none';   // close button only after first selection
  $('#overlay').classList.add('show');
  refreshGo();
}

$('#x').onclick = () => $('#overlay').classList.remove('show');
$('#locBtn').onclick = () => openModal();

$('#go').onclick = () => {
  LOC = { state: stateCombo.value(), district: distCombo.value() };
  $('#locTxt').textContent = LOC.district + ', ' + LOC.state;
  $('#locBtn').title = LOC.district + ', ' + LOC.state;
  $('#overlay').classList.remove('show');

  document.body.classList.add('ready');
  $('#topright').style.display = 'flex';
  $('#wxCard').classList.add('show');

  // start small if chat is open or the screen is a phone
  setWxMini(document.body.classList.contains('chatting') || window.innerWidth <= 640);
  loadWx();
  $('#q').focus();
};


/* ================= #weather card ================= */
// escape text before putting it into html
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const wxCard = $('#wxCard');
let wxLast = null, wxTimer = null;

// pick an emoji from the weather text
function wxIcon(c) {
  c = String(c || '').toLowerCase();
  if (c.includes('thunder')) return '⛈️';
  if (c.includes('drizzle') || c.includes('rain') || c.includes('shower')) return '🌧️';
  if (c.includes('snow') || c.includes('sleet')) return '❄️';
  if (/mist|fog|haze|smoke|dust|sand/.test(c)) return '🌫️';
  if (c.includes('clear')) return '☀️';
  if (c.includes('few clouds') || c.includes('scattered')) return '⛅';
  if (c.includes('cloud') || c.includes('overcast')) return '☁️';
  return '⛅';
}

function setWxMini(m) { wxCard.classList.toggle('mini', !!m); }

// round to 1 decimal if it's a number
const fmt = v => (typeof v === 'number' ? Math.round(v * 10) / 10 : v);

// pick a mood for the card colours from the weather text
function wxTone(c) {
  c = String(c || '').toLowerCase();
  if (c.includes('thunder')) return 'storm';
  if (/drizzle|rain|shower/.test(c)) return 'rain';
  if (/snow|sleet/.test(c)) return 'snow';
  if (/mist|fog|haze|smoke|dust|sand/.test(c)) return 'mist';
  if (c.includes('clear')) return 'clear';
  return 'cloud';
}

// one short farming tip based on the numbers (simple rules, not a forecast)
function wxTip(d) {
  const t = Number(d.temp), h = Number(d.humidity), w = Number(d.wind), r = Number(d.rain_1h);
  if (r > 0)   return '🌱 It is raining now, so hold off on irrigation.';
  if (t >= 38) return '🌱 Very hot. Water crops early morning or after sunset.';
  if (w >= 8)  return '🌱 Strong wind. Avoid spraying pesticides today.';
  if (h >= 85) return '🌱 High humidity. Keep an eye out for fungal disease.';
  if (h <= 30) return '🌱 Air is dry. Soil may need extra watering.';
  return '🌱 Good conditions for field work today.';
}

// draw the weather data into the card (small + full version both live inside)
function drawWx(d) {
  wxLast = d;
  const ic = wxIcon(d.condition);
  const place = esc(LOC.district + ', ' + LOC.state);
  const hum = Math.max(0, Math.min(100, Number(d.humidity) || 0));
  wxCard.dataset.tone = wxTone(d.condition);   // changes the glow colour

  wxCard.innerHTML = `
  <div class="mini"><span class="ic">${ic}</span><span class="mt">${fmt(d.temp)}°C</span><span class="mc">${esc(d.condition)}</span></div>
  <div class="full">
    <div class="loc"><span>📍 ${place}</span><span class="live">Live</span></div>
    <div class="top">
      <div class="t">${Math.round(d.temp)}<sup>°C</sup></div>
      <div class="orbicon"><span>${ic}</span></div>
    </div>
    <div class="c">${esc(d.condition)}</div>
    <div class="fl">Feels like ${fmt(d.feels_like)}°C</div>
    <div class="tiles">
      <div class="tile"><small>Humidity</small><b>${d.humidity}<em>%</em></b><div class="meter"><i style="width:${hum}%"></i></div></div>
      <div class="tile"><small>Wind</small><b>${d.wind}<em>m/s</em></b></div>
      <div class="tile"><small>Rain, 1h</small><b>${d.rain_1h}<em>mm</em></b></div>
    </div>
    <div class="tip">${wxTip(d)}</div>
  </div>`;
}

// show a plain message instead of data (errors)
function wxMsg(html) {
  wxCard.innerHTML =
    '<div class="mini"><span class="ic">⛅</span><span class="mc">' + html + '</span></div>' +
    '<div class="full"><div class="loc"><span>📍 ' + esc(LOC.district + ', ' + LOC.state) + '</span></div><div class="msg2">' + html + '</div></div>';
}

async function loadWx() {
  if (!LOC) return;
  const loc = LOC, key = loc.state + '|' + loc.district, cached = wxCache[key];

  if (cached && Date.now() - cached.t < 600000) {
    drawWx(cached.d);                 // fresh enough, reuse it
  } else {
    wxCard.innerHTML = '<div class="mini"><div class="dots"><i></i><i></i><i></i></div></div><div class="full"><div class="dots"><i></i><i></i><i></i></div></div>';
    try {
      const r = await fetch('/api/weather?' + new URLSearchParams(loc));
      const d = await r.json();
      if (!r.ok) throw 0;
      wxCache[key] = { t: Date.now(), d };
      if (LOC === loc) drawWx(d);     // ignore if the user changed location meanwhile
    } catch { if (LOC === loc) wxMsg('Weather unavailable'); }
  }

  clearTimeout(wxTimer);
  wxTimer = setTimeout(loadWx, 600000);   // refresh every 10 minutes
}

wxCard.onclick = () => setWxMini(!wxCard.classList.contains('mini'));


/* ================= #chat ================= */
const wrap = $('#wrap'), q = $('#q');

function scrollDown() { $('#chat').scrollTop = $('#chat').scrollHeight; }

// add a bubble to the chat (html = true when content is html)
function addMsg(cls, content, html) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls + (cls.includes('ai') ? ' glass' : '');
  html ? d.innerHTML = content : d.textContent = content;
  wrap.appendChild(d);
  scrollDown();
  return d;
}

function setBusy(b) { busy = b; $('#send').disabled = b || !q.value.trim(); }

// send a typed question to the server
async function ask(text) {
  text = text.trim();
  if (!text || busy || !LOC) return;

  document.body.classList.add('chatting');
  setWxMini(true);
  addMsg('user', text);
  q.value = ''; q.style.height = 'auto';
  setBusy(true);

  const wait = addMsg('ai', '<div class="dots"><i></i><i></i><i></i></div>', true);
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 180000);   // give up after 3 minutes

  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      signal: ctl.signal,
      body: JSON.stringify({ query: text, state: LOC.state, district: LOC.district, think: thinkOn })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Request failed');
    wait.innerHTML = DOMPurify.sanitize(marked.parse(d.answer));   // markdown -> safe html
  } catch (e) {
    wait.classList.add('err');
    wait.textContent = e.name === 'AbortError' ? 'This is taking too long. Please try again.'
      : (e instanceof TypeError ? 'Cannot reach the server. Check your connection and try again.' : e.message);
  } finally {
    clearTimeout(timer); setBusy(false); scrollDown();
  }
}

// Enter sends, Shift+Enter adds a new line
q.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(q.value); }
});

// auto-grow the textbox and toggle the send button
q.addEventListener('input', () => {
  q.style.height = 'auto';
  q.style.height = Math.min(q.scrollHeight, 150) + 'px';
  $('#send').disabled = busy || !q.value.trim();
});

$('#send').onclick = () => ask(q.value);
document.querySelectorAll('.sug').forEach(b => b.onclick = () => ask(b.textContent));
$('#think').onclick = () => { thinkOn = !thinkOn; $('#think').classList.toggle('on', thinkOn); };

// "+" button = start a fresh chat
$('#plus').onclick = () => {
  if (busy) return;
  wrap.innerHTML = '';
  document.body.classList.remove('chatting');
  setWxMini(window.innerWidth <= 640);
  q.focus();
};


/* ================= #voice (Gnani speech-to-text, Hindi) ================= */
let recorder = null, recChunks = [], recStream = null, recTimer = null;

// convert whatever the browser recorded into 16kHz mono WAV (what the server expects)
async function toWav(blob) {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const decoded = await ctx.decodeAudioData(await blob.arrayBuffer());
  ctx.close();

  // resample to 16000 Hz
  const off = new OfflineAudioContext(1, Math.ceil(decoded.duration * 16000), 16000);
  const src = off.createBufferSource();
  src.buffer = decoded; src.connect(off.destination); src.start();
  const pcm = (await off.startRendering()).getChannelData(0);

  // write the WAV header + samples
  const v = new DataView(new ArrayBuffer(44 + pcm.length * 2));
  const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); v.setUint32(4, 36 + pcm.length * 2, true); w(8, 'WAVEfmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, 16000, true); v.setUint32(28, 32000, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, 'data'); v.setUint32(40, pcm.length * 2, true);
  for (let i = 0; i < pcm.length; i++) {
    const s = Math.max(-1, Math.min(1, pcm[i]));
    v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
  }
  return new Blob([v], { type: 'audio/wav' });
}

// send the recording to the server and show the reply
async function askVoice(wav) {
  if (busy || !LOC) return;

  document.body.classList.add('chatting');
  setWxMini(true);
  const u = addMsg('user', '🎤 Processing your voice…');
  setBusy(true);

  const wait = addMsg('ai', '<div class="dots"><i></i><i></i><i></i></div>', true);
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 180000);

  try {
    const fd = new FormData();
    fd.append('audio', wav, 'voice.wav');
    fd.append('state', LOC.state);
    fd.append('district', LOC.district);
    fd.append('think', thinkOn);

    const r = await fetch('/api/voice', { method: 'POST', body: fd, signal: ctl.signal });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Request failed');

    u.textContent = '🎤 ' + d.transcript + '\n(' + d.translated + ')';   // what was heard + English version
    wait.innerHTML = DOMPurify.sanitize(marked.parse(d.answer));
  } catch (e) {
    u.textContent = '🎤 (voice message)';
    wait.classList.add('err');
    wait.textContent = e.name === 'AbortError' ? 'This is taking too long. Please try again.'
      : (e instanceof TypeError ? 'Cannot reach the server. Check your connection and try again.' : e.message);
  } finally {
    clearTimeout(timer); setBusy(false); scrollDown();
  }
}

/* ---- recording + live waveform ---- */
let recCancelled = false, audioCtx = null, analyser = null, rafId = null, tickId = null, recStart = 0;

// draw one rounded bar (falls back to a square one on old browsers)
function fillBar(c, x, y, w, h) {
  c.beginPath();
  c.roundRect ? c.roundRect(x, y, w, h, w / 2) : c.rect(x, y, w, h);
  c.fill();
}

// animate the bars from the real microphone signal
function drawWave() {
  const cv = $('#wave'), c = cv.getContext('2d'), dpr = window.devicePixelRatio || 1;
  cv.width = cv.clientWidth * dpr;
  cv.height = cv.clientHeight * dpr;

  const data = new Uint8Array(analyser.frequencyBinCount);
  const bars = 40, gap = 3 * dpr, bw = (cv.width - gap * (bars - 1)) / bars;

  (function loop() {
    rafId = requestAnimationFrame(loop);
    analyser.getByteFrequencyData(data);
    c.clearRect(0, 0, cv.width, cv.height);
    for (let i = 0; i < bars; i++) {
      const v = data[Math.floor(i * data.length * 0.6 / bars)] / 255;
      const h = Math.max(4 * dpr, v * cv.height);
      c.fillStyle = 'rgba(143,211,164,' + (0.45 + v * 0.55) + ')';
      fillBar(c, i * (bw + gap), (cv.height - h) / 2, bw, h);
    }
  })();
}

// stop animations and hide the popup
function closeListening() {
  cancelAnimationFrame(rafId); clearInterval(tickId); clearTimeout(recTimer);
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  $('#listen').classList.remove('show');
  $('#mic').classList.remove('rec');
}

async function startRec() {
  try { recStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch { alert('Microphone permission is needed for voice input.'); return; }

  recChunks = []; recCancelled = false;

  // analyser feeds the waveform
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  audioCtx.resume();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  analyser.smoothingTimeConstant = 0.75;
  audioCtx.createMediaStreamSource(recStream).connect(analyser);

  // the actual recorder
  recorder = new MediaRecorder(recStream);
  recorder.ondataavailable = e => recChunks.push(e.data);
  recorder.onstop = async () => {
    closeListening();
    recStream.getTracks().forEach(t => t.stop());   // release the mic
    if (recCancelled) return;
    try { askVoice(await toWav(new Blob(recChunks))); }
    catch { alert('Could not read the recorded audio. Please try again.'); }
  };
  recorder.start();

  $('#mic').classList.add('rec');
  $('#listen').classList.add('show');
  drawWave();

  // timer text, 15 second limit
  recStart = Date.now();
  $('#timer').textContent = '0:00 / 0:15';
  tickId = setInterval(() => {
    const s = Math.floor((Date.now() - recStart) / 1000);
    $('#timer').textContent = '0:' + String(s).padStart(2, '0') + ' / 0:15';
  }, 250);
  recTimer = setTimeout(() => recorder.state === 'recording' && recorder.stop(), 15000);
}

function stopRec(cancel) {
  if (recorder && recorder.state === 'recording') { recCancelled = !!cancel; recorder.stop(); }
}

$('#ldone').onclick = () => stopRec(false);
$('#lcancel').onclick = () => stopRec(true);
document.addEventListener('keydown', e => { if (e.key === 'Escape') stopRec(true); });

// hide the mic button if the browser can't record
if (!navigator.mediaDevices || !window.MediaRecorder) {
  $('#mic').style.display = 'none';
} else {
  $('#mic').title = 'Speak in Hindi';
  $('#mic').onclick = () => { if (!busy) startRec(); };
}


/* ================= #start ================= */
// load states/districts, then open the location popup
fetch('/api/locations')
  .then(r => r.json())
  .then(d => { DATA = d; openModal(); })
  .catch(() => alert('Could not load locations. Is the server running?'));
</script>
